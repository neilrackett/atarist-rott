name: PR

# Does it build? That is the whole job. This runs the same builds as
# release.yml, the three games and the ROTT Accelerator firmware, so a pull
# request that would break the release fails here instead, and it tags
# nothing, publishes nothing and keeps no artifacts. There is no host test
# suite in this port: verification is a build plus a run under Hatari or
# EmuMD, and a runner cannot do the second half.

on:
  pull_request:
    branches:
      - main
    # Documentation cannot break a build, so a pull request that changes
    # nothing else does not run (the same list as release.yml). Nothing
    # on main requires this check: if a rule ever does, these pull
    # requests would wait on it forever, so drop this filter then.
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - '**/COPYING'
      - '**/LICENSE'
  workflow_dispatch:

# Read-only: this workflow runs code from a contributor's branch, so it
# gets nothing it does not need. release.yml holds the write token.
permissions:
  contents: read

# A force-push mid-review should not leave two builds racing to report.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  # stcmd runs docker with -it unless this is set, and a runner has no
  # terminal.
  STCMD_NO_TTY: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Fetch the Xpad submodule
        # The game compiles lib/xpad/src/xpad.c. Only Xpad, deliberately:
        # checkout's own `submodules:` clones every submodule at depth 1,
        # and a shallow pico-sdk has no tags for sidecart/rp/build.sh to
        # pin to. That script fetches the SDKs itself, and EmuMD is not
        # needed to build either binary.
        run: git submodule update --init lib/xpad

      - name: Install the Pico toolchain
        # .github/actions/pico-toolchain: cmake, and the Arm toolchain
        # pinned by version and checksum.
        uses: ./.github/actions/pico-toolchain

      - name: Install the Atari ST toolkit
        # Generates /usr/local/bin/stcmd, which runs the m68k builds in a
        # container: the games, and the firmware's cartridge stub. The image
        # carries SDL 1.2 and MiNTLib for the SDL builds as well.
        run: curl -sL https://github.com/sidecartridge/atarist-toolkit-docker/releases/latest/download/install_atarist_toolkit_docker.sh | bash

      - name: Build the games
        # dist/ROTT_ST.TOS, dist/ROTT_SDL.TOS and dist/ROTT_030.TOS.
        run: stcmd make -j4 games

      - name: Build the ROTT Accelerator firmware
        # No APP_UUID_KEY on purpose. The Makefile falls back to the sample
        # UUID, which is all a build check needs, and it keeps this working
        # for pull requests from forks, where secrets are not available.
        run: make sidecart
