# The Pico toolchain for the ROTT Accelerator firmware, for pr.yml and
# release.yml alike. The Pico SDK is the sidecart/pico-sdk submodule,
# pinned by sidecart/rp/build.sh; what it needs from the runner is cmake
# and a host compiler for the tools it builds from source (pioasm,
# picotool), both from apt, and the ARM compiler: Arm's own GNU toolchain,
# the release the firmware is developed with, rather than Ubuntu's
# gcc-arm-none-eabi, which moves with the runner image. (CI's builds still
# differ from a Mac's: CMake 3.28 links the objects in another order than
# 4.x.)
name: Pico toolchain
description: cmake from apt, and Arm GNU Toolchain as PICO_TOOLCHAIN_PATH
runs:
  using: composite
  steps:
    - shell: bash
      env:
        # The checksum is Arm's, from the .sha256asc beside the download.
        ARM_GNU: 15.2.rel1
        ARM_GNU_SHA256: 597893282ac8c6ab1a4073977f2362990184599643b4c5ee34870a8215783a16
      run: |
        # The runner image ships Google's Chrome apt source, which has
        # served mismatched index files and failed `apt update` outright;
        # nothing here needs it. (Images without it are fine: a composite
        # step's bash has pipefail, so grep finding nothing mustn't fail.)
        { sudo grep -l dl.google.com /etc/apt/sources.list.d/* || true; } | xargs -r sudo rm -f
        sudo DEBIAN_FRONTEND=noninteractive apt update || true
        sudo DEBIAN_FRONTEND=noninteractive apt install -y cmake build-essential
        NAME="arm-gnu-toolchain-$ARM_GNU-x86_64-arm-none-eabi"
        curl -sSfL -o "$RUNNER_TEMP/$NAME.tar.xz" \
          "https://developer.arm.com/-/media/Files/downloads/gnu/$ARM_GNU/binrel/$NAME.tar.xz"
        echo "$ARM_GNU_SHA256  $RUNNER_TEMP/$NAME.tar.xz" | sha256sum -c -
        tar -xJf "$RUNNER_TEMP/$NAME.tar.xz" -C "$RUNNER_TEMP"
        echo "PICO_TOOLCHAIN_PATH=$RUNNER_TEMP/$NAME/bin" >> "$GITHUB_ENV"
        "$RUNNER_TEMP/$NAME/bin/arm-none-eabi-gcc" --version | head -1
