  <meta name="description" content="Rise of the Triad is a fast-paced first-person shooter developed by Apogee Software. Experience intense action, unique weapons, and challenging levels in this classic game right here in your web browser!" />

  <title>Rise of the Triad | Brought to the web by Neil Rackett</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #canvas {
      width: min(100vw, calc(100vh * 1.6));
      height: min(100vh, calc(100vw / 1.6));
      image-rendering: pixelated;
      background: #000;
      outline: none;
    }
  </style>
</head>

<body>
  <div id="viewport">
    <canvas id="canvas" width="320" height="200" tabindex="-1"></canvas>
  </div>
  <script>
    var Module = {
      print: function (text) {
        if (arguments.length > 1) {
          text = Array.prototype.slice.call(arguments).join(" ");
        }
        console.log(text);
      },
      printErr: function (text) {
        if (arguments.length > 1) {
          text = Array.prototype.slice.call(arguments).join(" ");
        }
        console.error(text);
      },
      canvas: (function () {
        var canvas = document.getElementById("canvas");
        canvas.addEventListener("contextmenu", function (event) {
          event.preventDefault();
        });
        canvas.addEventListener("webglcontextlost", function (event) {
          event.preventDefault();
          alert("WebGL context lost. Reload the page.");
        }, false);
        return canvas;
      })()
    };
  </script>
