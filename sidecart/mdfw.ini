; mdfw.ini - the ROTT Accelerator built for EmuMD (mdfw build).
; https://github.com/neilrackett/emumd (emu/emumd); paths are relative to
; this file.

[firmware]
name = ROTT Accelerator
version = v1.4.0-beta.5
output = build/rott-accelerator.mdfw

[sources]
; The firmware's portable parts. Left out: main.c, emul.c (bring-up),
; romemul/commemul (PIO + DMA), sdcard, select, reset, settings, md_core1
; (emu/mdfw_app.c stands in for it).
files =
    emu/mdfw_app.c
    rp/src/md_main.c
    rp/src/md_music.c
    rp/src/md_proto.c
    rp/src/md_pack.c
    rp/src/md_video.c
    rp/src/tprotocol.c
    rp/src/rott/*.c
    ../rott/atari_tables.c
    ../rott/audiolib/atari_music.c

[compile]
shims =
    emu/shim
include =
    rp/src/include
    rp/src
    include
    ../rott
defines =
    RELEASE_VERSION=MDFW_VERSION
    YMMUSIC_MD
cflags = -O2

[run]
; mdfw run: the ST build is drive C: and ROTT_ST.TOS starts by itself; the
; card needs rott/HUNTBGIN.WAD (copy or link it into tmp/sd from tmp/ROTT).
; Frame dumps from the firmware's side: -O dump=DIR [-O dump-every=N].
sd = ../tmp/sd
harddrive = ../dist
machine = megaste
hatari_args = --cpuclock 16 --memsize 4 --auto 'C:\ROTT_ST.TOS'
